<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d1117; color: #c9d1d9; padding: 20px;
}
.container { max-width: 1400px; margin: 0 auto; }
h1 { font-size: 24px; margin-bottom: 4px; }
h1 small { font-size: 14px; color: #8b949e; font-weight: 400; }
.subtitle { color: #8b949e; margin-bottom: 20px; font-size: 14px; }

/* status bar */
.status-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.status-item {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 14px 20px; flex: 1; min-width: 130px;
}
.status-item .label { font-size: 11px; text-transform: uppercase; color: #8b949e; letter-spacing: 0.5px; }
.status-item .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
.status-item .sub { font-size: 12px; color: #8b949e; margin-top: 2px; }
.green { color: #3fb950; }
.red { color: #f85149; }
.yellow { color: #d29922; }
.blue { color: #58a6ff; }
.purple { color: #bc8cff; }

/* cards */
.card {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 20px; margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin-bottom: 12px; color: #f0f6fc; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #21262d; }
th { color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
tr:hover { background: #1c2128; }

/* grid */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

/* badges */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 12px;
  font-size: 11px; font-weight: 600;
}
.badge-win { background: rgba(63,185,80,0.15); color: #3fb950; }
.badge-loss { background: rgba(248,81,73,0.15); color: #f85149; }
.badge-open { background: rgba(88,166,255,0.15); color: #58a6ff; }
.badge-close { background: rgba(139,148,158,0.15); color: #8b949e; }

/* tag */
.tag {
  display: inline-block; padding: 2px 6px; border-radius: 4px;
  background: #21262d; color: #8b949e; font-size: 11px; margin-right: 4px;
}

/* progress bar */
.progress-bar {
  width: 100%; height: 4px; background: #21262d; border-radius: 2px; margin-top: 8px;
}
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* scrollable */
.scroll { max-height: 400px; overflow-y: auto; }
.scroll-sm { max-height: 250px; overflow-y: auto; }

/* lesson */
.lesson { padding: 10px 0; border-bottom: 1px solid #21262d; font-size: 13px; line-height: 1.5; }
.lesson:last-child { border: none; }
.lesson .meta { font-size: 11px; color: #8b949e; margin-top: 4px; }

/* decision */
.decision { padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
.decision:last-child { border: none; }

/* tooltip/truncate */
.truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* chart wrap */
.chart-wrap { position: relative; height: 280px; }

/* responsive */
@media (max-width: 768px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

.refresh-note {
  text-align: right; font-size: 11px; color: #484f58; margin-bottom: 8px;
}
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <h1>📊 Meridian Monitor <small id="mode-badge"></small></h1>
      <div class="subtitle">Live dashboard — reads JSON files directly, auto-refresh every 10s</div>
    </div>
    <div style="text-align:right;font-size:12px;color:#484f58;">
      <div id="last-updated">—</div>
    </div>
  </div>

  <div class="status-bar" id="stats-bar"></div>

  <div class="grid-2">
    <div class="card">
      <h2>📈 PnL per Position</h2>
      <div class="chart-wrap"><canvas id="pnlChart"></canvas></div>
    </div>
    <div class="card">
      <h2>🏆 Pool Win Rates</h2>
      <div class="scroll-sm" id="pool-list"></div>
    </div>
  </div>

  <div class="grid-3">
    <div class="card">
      <h2>📋 Recent Actions</h2>
      <div class="scroll-sm" id="actions-list"></div>
    </div>
    <div class="card">
      <h2>🧠 Recent Decisions</h2>
      <div class="scroll-sm" id="decisions-list"></div>
    </div>
    <div class="card">
      <h2>📚 Lessons</h2>
      <div class="scroll-sm" id="lessons-list"></div>
    </div>
  </div>

  <div class="card">
    <h2>📜 Position History</h2>
    <div class="scroll" id="positions-table-wrap"></div>
  </div>
</div>

<script>
// Config: set API_BASE via query param ?api=http://YOUR_VPS_IP:3030
const urlParams = new URLSearchParams(window.location.search);
const API_BASE = urlParams.get('api') || '';

let pnlChart = null;

async function fetchJSON(url) {
  const r = await fetch(API_BASE + url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  const s = n >= 0 ? '+' : '';
  return s + Number(n).toFixed(2) + '%';
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return Math.floor(diff / 86400000) + 'd ago';
}

function renderStats(overview) {
  const bar = document.getElementById('stats-bar');
  document.getElementById('mode-badge').textContent = overview.dryRun ? '🔴 DRY RUN' : '🟢 LIVE';

  bar.innerHTML = `
    <div class="status-item">
      <div class="label">Total Trades</div>
      <div class="value">${overview.totalTrades}</div>
      <div class="sub">${overview.closedPositions} closed</div>
    </div>
    <div class="status-item">
      <div class="label">Win Rate</div>
      <div class="value ${overview.winRate >= 50 ? 'green' : 'red'}">${overview.winRate}%</div>
      <div class="sub">${overview.wins}W / ${overview.losses}L</div>
    </div>
    <div class="status-item">
      <div class="label">Total PnL</div>
      <div class="value ${overview.totalPnL >= 0 ? 'green' : 'red'}">$${fmt(overview.totalPnL)}</div>
      <div class="sub">Avg: $${fmt(overview.avgPnL)} / trade</div>
    </div>
    <div class="status-item">
      <div class="label">Total Fees</div>
      <div class="value blue">$${fmt(overview.totalFees)}</div>
      <div class="sub">Avg ${overview.avgFeePct}% of capital</div>
    </div>
    <div class="status-item">
      <div class="label">Open Positions</div>
      <div class="value ${overview.openPositions > 0 ? 'yellow' : 'green'}">${overview.openPositions}</div>
      <div class="sub">${overview.poolsTracked} pools tracked</div>
    </div>
  `;
}

function renderPools(pools) {
  const el = document.getElementById('pool-list');
  const sorted = [...pools].sort((a, b) => (b.total_deploys || 0) - (a.total_deploys || 0));
  let html = `<table><thead><tr><th>Pool</th><th>Deploys</th><th>Win Rate</th><th>Avg PnL</th></tr></thead><tbody>`;
  for (const p of sorted) {
    if (!p.total_deploys) continue;
    const wr = (p.win_rate || 0) * 100;
    html += `<tr>
      <td><strong>${p.name || '?'}</strong></td>
      <td>${p.total_deploys}</td>
      <td class="${wr >= 50 ? 'green' : 'red'}">${wr.toFixed(0)}%</td>
      <td class="${(p.avg_pnl_pct || 0) >= 0 ? 'green' : 'red'}">${fmtPct(p.avg_pnl_pct)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  if (!sorted.some(p => p.total_deploys)) html = '<div style="color:#8b949e;padding:20px;text-align:center;">No deploy data yet</div>';
  el.innerHTML = html;
}

function renderDecisions(decisions) {
  const el = document.getElementById('decisions-list');
  let html = '';
  const shown = decisions.slice(0, 15);
  for (const d of shown) {
    const cls = d.type === 'deploy' ? 'green' : d.type === 'close' ? 'red' : 'yellow';
    html += `<div class="decision">
      <span class="badge badge-${d.type === 'no_deploy' ? 'loss' : d.type === 'deploy' ? 'win' : 'close'}">${d.type}</span>
      <strong style="color:#e6edf3;">${d.pool_name || (d.summary && d.summary.substring(0, 60)) || '—'}</strong>
      <div style="color:#8b949e;font-size:11px;margin-top:2px;">${fmtTime(d.ts)} · ${d.actor || ''}</div>
    </div>`;
  }
  if (!shown.length) html = '<div style="color:#8b949e;padding:20px;text-align:center;">No decisions yet</div>';
  el.innerHTML = html;
}

function renderActions(actions) {
  const el = document.getElementById('actions-list');
  let html = '';
  const shown = actions.slice(0, 20);
  for (const a of shown) {
    const isWin = a.success;
    html += `<div class="decision">
      <span class="badge ${isWin ? 'badge-win' : 'badge-loss'}">${a.tool || '?'}</span>
      <span style="color:#e6edf3;font-size:12px;">${a.args?.pool_name || a.args?.position_address?.substring(0, 8) || ''}</span>
      <div style="color:#8b949e;font-size:11px;margin-top:2px;">${fmtTime(a.timestamp)} ${a.duration_ms ? '· ' + (a.duration_ms/1000).toFixed(1) + 's' : ''}</div>
    </div>`;
  }
  if (!shown.length) html = '<div style="color:#8b949e;padding:20px;text-align:center;">No actions yet</div>';
  el.innerHTML = html;
}

function renderLessons(lessons) {
  const el = document.getElementById('lessons-list');
  let html = '';
  const shown = lessons.filter(l => l.pinned || !l.sourceType || l.sourceType === 'manual').slice(0, 10);
  for (const l of shown) {
    const isGood = l.outcome === 'good' || l.outcome === 'manual';
    html += `<div class="lesson">
      <span style="color:${isGood ? '#3fb950' : '#f85149'};font-weight:600;">${isGood ? '✓' : '✗'}</span>
      ${l.rule?.substring(0, 200) || ''}
      <div class="meta">${l.tags?.map(t => `<span class="tag">${t}</span>`).join('') || ''} ${l.created_at ? fmtTime(l.created_at) : ''}</div>
    </div>`;
  }
  if (!shown.length) html = '<div style="color:#8b949e;padding:20px;text-align:center;">No lessons yet</div>';
  el.innerHTML = html;
}

function renderPositions(positions, performance) {
  const el = document.getElementById('positions-table-wrap');
  let html = `<table><thead><tr>
    <th>Pool</th><th>Strategy</th><th>SOL</th><th>Status</th><th>PnL %</th><th>Fees</th><th>Held</th><th>Close Reason</th>
  </tr></thead><tbody>`;

  const perfMap = {};
  for (const p of performance) perfMap[p.position] = p;

  const sorted = [...positions].sort((a, b) => new Date(b.deployed_at || 0) - new Date(a.deployed_at || 0)).slice(0, 50);
  for (const p of sorted) {
    const perf = perfMap[p.position] || {};
    const pnl = perf.pnl_pct;
    const fees = perf.fees_earned_usd || p.total_fees_claimed_usd || 0;
    const mins = perf.minutes_held || 0;
    const hrs = mins > 60 ? (mins / 60).toFixed(1) + 'h' : mins + 'm';
    const reason = perf.close_reason || p.notes?.[p.notes.length - 1] || '';
    const status = p.closed ? 'Closed' : 'Open';
    html += `<tr>
      <td><strong>${p.pool_name || '?'}</strong></td>
      <td><span class="tag">${p.strategy || '?'}</span></td>
      <td>${p.amount_sol || '—'}</td>
      <td><span class="badge ${p.closed ? 'badge-close' : 'badge-open'}">${status}</span></td>
      <td class="${pnl >= 0 ? 'green' : 'red'}">${pnl != null ? fmtPct(pnl) : '—'}</td>
      <td>$${fmt(fees)}</td>
      <td>${hrs}</td>
      <td style="font-size:11px;color:#8b949e;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${reason}">${reason.substring(0, 60)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  if (!sorted.length) html = '<div style="color:#8b949e;padding:20px;text-align:center;">No positions yet</div>';
  el.innerHTML = html;
}

function renderChart(performance) {
  const ctx = document.getElementById('pnlChart').getContext('2d');
  const sorted = [...performance].sort((a, b) => new Date(a.recorded_at || 0) - new Date(b.recorded_at || 0));
  const labels = sorted.map(p => p.pool_name || '?');
  const pnls = sorted.map(p => p.pnl_pct || 0);
  const colors = pnls.map(v => v >= 0 ? 'rgba(63,185,80,0.8)' : 'rgba(248,81,73,0.8)');
  const borderColors = pnls.map(v => v >= 0 ? '#3fb950' : '#f85149');

  if (pnlChart) { pnlChart.destroy(); }

  pnlChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'PnL %',
        data: pnls,
        backgroundColor: colors,
        borderColor: borderColors,
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterLabel: function(ctx) {
              const p = sorted[ctx.dataIndex];
              return `Fees: $${fmt(p.fees_earned_usd)}\nHeld: ${p.minutes_held || 0}m\n${p.close_reason || ''}`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#8b949e', font: { size: 10 } },
          grid: { color: '#21262d' }
        },
        y: {
          ticks: { color: '#8b949e', callback: v => v + '%' },
          grid: { color: '#21262d' }
        }
      }
    }
  });
}

async function refresh() {
  try {
    const [overview, performance, positions, poolData, decisions, lessons, actions] = await Promise.all([
      fetchJSON('/api/overview'),
      fetchJSON('/api/performance'),
      fetchJSON('/api/positions'),
      fetchJSON('/api/pools'),
      fetchJSON('/api/decisions'),
      fetchJSON('/api/lessons'),
      fetchJSON('/api/actions'),
    ]);

    renderStats(overview);
    renderPools(poolData.pools || []);
    renderDecisions(decisions);
    renderActions(actions);
    renderLessons(lessons);
    renderPositions(positions, performance);
    renderChart(performance);

    document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Refresh failed:', e);
    document.getElementById('last-updated').textContent = '⚠️ Error: ' + e.message;
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
